# Font Configuration
font_family JetBrainsMono Nerd Font
font_size 13
disable_ligatures never

# Window Configuration
window_padding_width 12
background_opacity 0.5
background_blur 32
hide_window_decorations yes
confirm_os_window_close 0
tab_bar_background #101418

# Cursor Configuration
cursor_shape beam
cursor_blink_interval 0
cursor_shape_unfocused unchanged
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Cell height adjustment (matches ghostty adjust-cell-height 4)
modify_font cell_height 4px

# Scrollback
scrollback_lines 50000

# Terminal features
mouse_hide_wait 0
copy_on_select clipboard
strip_trailing_spaces smart

# Key bindings
map ctrl+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+e show_scrollback

# Selection keybinds
map shift+up scroll_line_up
map shift+down scroll_line_down
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end

# Tab configuration
tab_bar_edge top
tab_bar_min_tabs 2

# Shell integration
shell_integration enabled no-cursor

# Single instance
single_instance yes

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
