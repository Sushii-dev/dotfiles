# Brave launch flags — read by /usr/bin/brave (brave-bin) at startup.
# One flag per line. Lines starting with # are ignored.
# Managed by chezmoi (universal — rendering flags safe on all machines).

# Native Wayland: auto = Wayland on niri/Plasma-Wayland, X11 on Plasma-X session.
# Fixes blurry XWayland rendering + enables proper client-side decorations.
--ozone-platform-hint=auto
