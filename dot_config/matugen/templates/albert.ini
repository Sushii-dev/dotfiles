;
; DMS Matugen -> Albert widgetsboxmodel theme (auto-generated, follows wallpaper).
; Frosted glass = alpha-FIRST window_background_brush (#AARRGGBB) + compositor blur
; (KWin Better Blur / niri). Shape (tall rows / big icons / radius) lives in
; ~/.config/albert/config [widgetsboxmodel], NOT here.
;

surface            = {{colors.surface.default.hex}}
surface_container  = {{colors.surface_container.default.hex}}
on_surface         = {{colors.on_surface.default.hex}}
on_surface_variant = {{colors.on_surface_variant.default.hex}}
primary            = {{colors.primary.default.hex}}
on_primary         = {{colors.on_primary.default.hex}}

; alpha-FIRST 8-digit hex (#AARRGGBB) — inverse of CSS
surface_frost = #E6{{colors.surface.default.hex_stripped}}
primary_pill  = #40{{colors.primary.default.hex_stripped}}
input_fill    = #66{{colors.surface_container.default.hex_stripped}}

[palette]
base             = $input_fill
text             = $on_surface
window           = $surface
window_text      = $on_surface
button           = $surface_container
button_text      = $on_surface
highlight        = $primary
highlight_text   = $on_primary
placeholder_text = $on_surface_variant
link             = $primary
link_visited     = $primary

[window]
window_background_brush                = $surface_frost
window_border_brush                    = $primary
window_shadow_brush                    = #80000000
input_background_brush                 = $input_fill
input_border_brush                     = $primary
input_trigger_color                    = $primary
input_hint_color                       = $on_surface_variant
settings_button_color                  = $on_surface_variant
settings_button_highlight_color        = $primary
result_item_selection_background_brush = $primary_pill
result_item_selection_border_brush     = transparent
result_item_selection_text_color       = $on_surface
result_item_selection_subtext_color    = $on_surface_variant
result_item_text_color                 = $on_surface
result_item_subtext_color              = $on_surface_variant
action_item_selection_background_brush = $primary_pill
action_item_selection_border_brush     = transparent
action_item_selection_text_color       = $on_surface
action_item_text_color                 = $on_surface
