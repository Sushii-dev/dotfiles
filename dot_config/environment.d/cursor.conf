# Cursor THEME only. XCURSOR_SIZE is deliberately absent.
#
# It used to pin XCURSOR_SIZE=24 here. environment.d is loaded into the systemd
# user environment before graphical-session.target, so kwin_wayland and every
# client inherited 24 and it beat kcminputrc's cursorSize -- the System Settings
# slider appeared to do nothing. Posy_Cursor_Black has no 24px bitmap either
# (native sizes: 32/48/64/96/128), so 24 was downscaled from 32 and looked soft.
#
# Size is now owned by KDE: System Settings > Appearance > Cursors > Size,
# which writes kcminputrc [Mouse] cursorSize + kdeglobals [General] XCursorSize.
XCURSOR_THEME=Posy_Cursor_Black
