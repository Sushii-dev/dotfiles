# Video output
vo=gpu-next
hwdec=auto
gpu-api=vulkan

# Disable default OSC (uosc replaces it)
osc=no
osd-bar=no

# Window
border=no
title='${media-title}'
background-color='#101418'

# Subtitles
sub-auto=fuzzy
sub-font-size=42
slang=en,eng

# Audio
alang=ja,jpn,en,eng

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template='%F_%P'

# General
keep-open=yes
save-position-on-quit=yes
